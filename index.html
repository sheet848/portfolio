<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./assets/SN.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <title>Sheetal Naik | Frontend Developer | Portfolio</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="wrap" role="main">
    <header>
      <div class="brand" aria-label="Brand">
        <div class="logo">SN</div>
        <div class="title">Sheetal — portfolio</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="toggle" id="themeToggle" aria-label="Toggle dark/light">☀️</button>
      </div>
    </header>

    <!-- HERO GRID (projects-first) -->
    <section class="hero" id="projects" aria-label="Featured projects">
      <!-- tiles will be injected by JS -->
    </section>

    <div class="footer-sections" aria-hidden="false">
      <div class="card-min" id="contact">
        <h5>Contact</h5>
        <p style="color:var(--muted);margin:6px 0 0">Email: <a href="mailto:sheetal@example.com"
            style="color:var(--accent1);text-decoration:none">sheetal@example.com</a></p>
        <div style="margin-top:12px;display:flex;gap:10px">
          <a class="btn" href="#" aria-label="Link to github">GitHub</a>
          <a class="btn" href="#" aria-label="Link to live resume">Resume</a>
        </div>
      </div>
    </div>
  </div>

  <!-- project detail panel -->
  <aside class="panel" id="panel" role="dialog" aria-hidden="true" aria-labelledby="panelTitle">
    <button class="close" id="panelClose" aria-label="Close panel">✕</button>
    <div class="hero-thumb" id="panelThumb" aria-hidden="true"></div>
    <h3 id="panelTitle">Project Title</h3>
    <p id="panelDesc" style="color:var(--muted);margin-top:6px">Detailed description goes here...</p>
    <div class="tags" id="panelTags" style="margin-top:8px"></div>
    <div class="links">
      <a id="liveLink" class="btn" href="#" target="_blank" rel="noopener">View live</a>
      <a id="codeLink" class="btn" href="#" target="_blank" rel="noopener">Source</a>
    </div>
  </aside>
    <script src="script.js"></script>
</body>
</html>
