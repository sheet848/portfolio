<!-- Save as index.html and open in browser -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sheetal Naik | Frontend Developer Portfolio </title>
  <link rel="icon" type="image/svg+xml" href="./assets/SN.svg">

  <!-- GSAP + ScrollTrigger (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="wrap" role="main">
    <header>
      <div class="brand" aria-label="Brand">
        <div class="logo">
          <img src="./assets/SN.svg" alt="sn-brand-logo" style="width: 70%;">
        </div>
        <div class="title" style="font-size: 30px;">Sheetal Naik — Portfolio</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="toggle" id="themeToggle" aria-label="Toggle dark/light">
        ⚪ 
        </button>
      </div>
    </header>

    <!-- HERO GRID (projects-first) -->
    <section class="hero" id="projects" aria-label="Featured projects">
      <!-- tiles will be injected by JS -->
    </section>

    <!-- contact section -->
    <div class="footer-sections" aria-hidden="false">
      <div class="card-min" id="contact">
        <h5>Contact</h5>
        <p style="color:var(--muted);margin:6px 0 0">Email: <a href="mailto:sheetalnaik310@gmail.com"
            style="color:var(--accent1);text-decoration:none; font-weight: 700;">sheetalnaik310@gmail.com</a></p>
        <div style="margin-top:12px;display:flex;gap:10px">
          <a class="btn" href="https://github.com/sheet848" target="_blank" aria-label="Link to github">GitHub</a>
          <a class="btn" href="../assets/Sheetal Naik Resume.pdf" target="_blank" aria-label="Link to live resume">Resume</a>
        </div>
      </div>
    </div>
  </div>


  <!-- project detail panel -->
  <aside class="panel" id="panel" role="dialog" aria-hidden="true" aria-labelledby="panelTitle">
    <button class="close" id="panelClose" aria-label="Close panel">✕</button>
    <div class="hero-thumb" aria-hidden="true">
      <img src="../assets/cv-1.png" alt="CV-resume" id="panelThumb">
    </div>
    <h3 id="panelTitle">Project Title</h3>
    <p id="panelDesc1" style="color:var(--muted);margin: 10px 0;">Detailed description goes here...</p>
    <p id="panelDesc2" style="color:var(--muted);margin: 10px 0;">Detailed description goes here...</p>
    <div class="tags" id="panelTags" style="margin-top:8px"></div>
    <div class="links">
      <a id="liveLink" class="btn" href="#" target="_blank" rel="noopener">View live</a>
      <a id="codeLink" class="btn" href="#" target="_blank" rel="noopener">Source</a>
    </div>
  </aside>
<script src="./script.js" ></script>
</body>

</html>
